version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vote_app
    restart: unless-stopped
    ports:
      - "8011:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./public/storage:/var/www/html/public/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    networks:
      - vote_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Serviço opcional para Redis (cache/sessões)
  redis:
    image: redis:7-alpine
    container_name: vote_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vote_network
    profiles:
      - redis

  # Serviço opcional para PostgreSQL (alternativa ao SQLite)
  postgres:
    image: postgres:15-alpine
    container_name: vote_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vote_db
      POSTGRES_USER: vote_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vote_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vote_network
    profiles:
      - postgres

networks:
  vote_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local